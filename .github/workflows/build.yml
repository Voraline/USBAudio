name: Build USB Audio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows application
        run: cmake -S . -B build/windows -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build Windows application
        run: cmake --build build/windows --config Release --parallel
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-usb-audio
          path: build/windows/Release/UsbAudioSender.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Build Android release APK
        run: gradle --no-daemon --project-dir android assembleRelease
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
