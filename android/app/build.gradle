plugins {
    id "com.android.application"
}

android {
    namespace "com.example.usbaudio"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.example.usbaudio"
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Builds libusb_audio_native.so with cargo-ndk (Rust) and places it in
// jniLibs, where AGP packages it into the APK. Requires Rust and cargo-ndk
// (cargo install cargo-ndk) and the Android NDK visible to cargo-ndk via
// ANDROID_NDK_HOME (or ANDROID_NDK_ROOT). Platform 33 is required because
// libaaudio.so only exists in the API 26+ sysroot; cargo-ndk's default
// platform is lower and would fail to link -laaudio.
tasks.register("cargoNdkBuild", Exec) {
    workingDir file("../../rust/android")
    commandLine "cargo", "ndk",
        "-t", "arm64-v8a",
        "--platform", "33",
        "-o", file("src/main/jniLibs").absolutePath,
        "build", "--release"
}

tasks.named("preBuild") {
    dependsOn "cargoNdkBuild"
}
